<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>{{FULL_NAME}} - Resume</title>
  <style>
    :root {
      --ink: #0f172a;
      --muted: #475569;
      --accent: #1e3a8a;
      --accent-light: #eff6ff;
      --rule: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Calibri, Arial, "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, sans-serif;
      font-size: 9.75pt;
      line-height: 1.38;
      color: var(--ink);
      background: #fff;
      -webkit-font-smoothing: antialiased;
      orphans: 2;
      widows: 2;
    }

    .resume {
      width: 100%;
      max-width: 100%;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding-bottom: 11px;
      margin-bottom: 14px;
      border-bottom: 2px solid var(--accent);
    }

    header h1 {
      font-size: 22.5pt;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 3px;
    }

    header .title {
      font-size: 11.2pt;
      font-weight: 600;
      color: #334155;
      margin-bottom: 7px;
    }

    header .contact {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1px 0;
      font-size: 9.5pt;
      font-weight: 400;
      color: #334155;
    }

    .contact-row {
      display: flex;
      flex-wrap: nowrap;
      justify-content: center;
      align-items: center;
      white-space: nowrap;
    }

    .contact-item {
      display: inline-flex;
      align-items: center;
    }

    header .contact a {
      color: inherit;
      text-decoration: none;
    }

    header .contact a:hover {
      color: var(--ink);
    }

    header .contact .sep {
      color: #9ca3af;
      font-weight: 400;
      margin: 0 6px;
      user-select: none;
    }

    section {
      margin-bottom: 13px;
    }

    h2 {
      font-size: 11pt;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.9px;
      color: var(--accent);
      padding-bottom: 3px;
      margin-bottom: 8px;
      border-bottom: 1.25px solid #cbd5e1;
      break-after: avoid;
      page-break-after: avoid;
    }

    .summary {
      text-align: justify;
      font-weight: 400;
      font-size: 9.75pt;
      line-height: 1.6;
      color: #1e293b;
    }

    .skill-group {
      margin-bottom: 4.5px;
      font-size: 9.5pt;
      line-height: 1.34;
      color: #1e293b;
    }

    .skill-group strong {
      font-weight: 700;
      color: #0f172a;
    }

    .job {
      margin-bottom: 13px;
      page-break-inside: avoid;
    }

    .job:last-child {
      margin-bottom: 0;
    }

    .job-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      margin-bottom: 4px;
      break-after: avoid;
      page-break-after: avoid;
    }

    .job-title-line {
      font-size: 10.2pt;
      font-weight: 700;
      color: #0f172a;
    }

    .job-company {
      font-weight: 600;
      color: #334155;
    }

    .job-meta {
      font-size: 9pt;
      font-weight: 500;
      color: #475569;
      white-space: nowrap;
      text-align: right;
      flex-shrink: 0;
    }

    ul.bullet-list {
      margin: 3px 0 0 0;
      padding-left: 16px;
      list-style-type: disc;
    }

    ul.bullet-list li {
      margin-bottom: 4.5px;
      padding-left: 2px;
      font-size: 9.6pt;
      line-height: 1.34;
      color: #1e293b;
      break-inside: avoid;
      page-break-inside: avoid;
    }

    ul.bullet-list li::marker {
      color: var(--muted);
    }

    ul.bullet-list li strong {
      font-weight: 700;
      color: #0f172a;
    }

    .project-link a {
      color: #1d4ed8;
      text-decoration: underline;
      font-size: 9pt;
    }

    .education-item {
      margin-bottom: 4px;
      page-break-inside: avoid;
    }

    .education-line {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      font-size: 9.8pt;
    }

    .education-degree {
      font-weight: 700;
      color: #0f172a;
    }

    .education-institution {
      font-weight: 600;
      color: #334155;
    }

    @media print {
      body {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .job,
      .education-item {
        break-inside: avoid;
        page-break-inside: avoid;
      }

      h2 {
        break-after: avoid;
        page-break-after: avoid;
      }

      .page-break {
        page-break-after: always;
        break-after: page;
      }
    }
  </style>
</head>

<body>
  <div class="resume">{{CONTENT}}</div>
</body>

</html>
